# =============================================================================
# loki-config.yml — конфигурация Grafana Loki для ASG
# -----------------------------------------------------------------------------
# Развёртывание: single-binary (один процесс) для локального dev / staging.
# Для prod — развернуть как microservices (distributor / ingester / querier /
# compactor / ruler) с S3-совместимым object_store.
#
# Логи asg-core пишутся в JSON-формате (см. asg.logging.format=json в HOCON),
# поля: request_id, user_id, ontology, contour — индексируются как labels через
# Promtail pipeline_stages (см. отдельный promtail-config.yml).
# =============================================================================

auth_enabled: false   # multi-tenant отключён для dev; для prod — true с X-Scope-OrgID

server:
  http_listen_port: 3100        # Loki HTTP API (ingestion + query)
  grpc_listen_port: 9096        # Loki gRPC (внутренняя коммуникация компонентов)
  log_level: info
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s
  http_server_idle_timeout: 2m
  grpc_server_max_recv_msg_size: 16777216    # 16 MiB — для больших чанков логов
  grpc_server_max_send_msg_size: 16777216

common:
  instance_addr: 127.0.0.1      # single-binary — все компоненты на одной ноде
  path_prefix: /loki             # корневой каталог данных (монтируется как volume)
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1          # single-binary → 1 копия
  ring:
    kvstore:
      store: inmemory             # для prod — memberlist с gossip-протоколом

# -----------------------------------------------------------------------------
# Schema v13 — использует TSDB вместо BoltDB (для индексации логов).
# TSDB-индекс эффективнее при высокой кардинальности лейблов (ontology+contour).
# -----------------------------------------------------------------------------
schema_config:
  configs:
    - from: 2024-01-01           # дата перехода на схему v13
      store: tsdb
      object_store: filesystem   # для prod — s3 (Yandex Object Storage)
      schema: v13
      index:
        prefix: index_
        period: 24h              # партиция индекса — 1 сутки

ingester:
  chunk_idle_period: 30m          # чанк закрывается через 30m без новых данных
  chunk_target_size: 1572864      # 1.5 MiB — целевой размер чанка (до сжатия)
  max_chunk_age: 1h               # принудительное закрытие чанка каждый час
  max_chunk_retrieve_size: 1572864
  wal:
    enabled: true                 # Write-Ahead-Log для восстановления при рестарте
    dir: /loki/wal
    flush_on_shutdown: true
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

# -----------------------------------------------------------------------------
# Лимиты — предотвращают перегрузку Loki аномальными логами.
# -----------------------------------------------------------------------------
limits_config:
  retention_period: 720h          # 30 дней хранения логов (СМЭВ-аудит)
  reject_old_samples: true         # отбрасывать логи старше reject_old_samples_max_age
  reject_old_samples_max_age: 168h # 7 дней — защита от приёма "старых" логов по ошибке
  max_query_series: 500            # ограничение числа серий в одном запросе (защита от OOM)
  max_query_length: 721h           # максимальный диапазон запроса — 30 дней + час
  max_query_parallelism: 16        # параллелизм выполнения запросов
  cardinality_limit: 100000       # ограничение кардинальности лейблов на tenant
  max_streams_per_user: 10000      # лимит активных stream'ов на tenant
  max_global_streams_per_user: 0   # 0 = без глобального лимита (single-binary)
  ingestion_rate_mb: 10           # 10 MiB/sec — rate ingestion на tenant
  ingestion_burst_size_mb: 20      # пиковой размер burst
  max_label_name_length: 1024
  max_label_value_length: 2048
  max_label_names_per_series: 30
  split_queries_by_interval: 15m  # разбиение запросов на 15-минутные чанки
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  shard_streams:
    enabled: true
    desired_rate: 5MB

# -----------------------------------------------------------------------------
# Compactor — удаляет устаревшие индексы и чанки согласно retention_period.
# -----------------------------------------------------------------------------
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true          # включает применение retention_period
  retention_delete_delay: 2h        # задержка перед физическим удалением (anti-flap)
  retention_delete_worker_count: 150 # число воркеров для удаления
  delete_request_store: filesystem # для prod — s3 (общий между компонентами)

# -----------------------------------------------------------------------------
# Ruler — правила алертов на основе логов (в dev отключён, используется Prometheus).
# -----------------------------------------------------------------------------
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  alertmanager_url: ""             # пусто → алерты не отправляются
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# -----------------------------------------------------------------------------
# Query range — разделение долгих запросов на параллельные чанки.
# -----------------------------------------------------------------------------
query_range:
  align_queries_with_step: true
  max_retries: 5
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
        ttl: 24h

frontend:
  max_outstanding_per_tenant: 4096
  log_queries_longer_than: 5s
  compress_responses: true

# -----------------------------------------------------------------------------
# Analytics — отключаем phone-home в Yandex Cloud (изоляция).
# -----------------------------------------------------------------------------
analytics:
  reporting_enabled: false

# k8s/hpa.yaml — HorizontalPodAutoscaler для ASG Core
# Масштабирование 3..30 реплик по CPU (70%), памяти (80%) и кастомной метрике
# http_requests_per_second (требует установленный prometheus-adapter в кластере).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: asg-core
  namespace: asg-system
  labels:
    app.kubernetes.io/name: asg
    app.kubernetes.io/component: core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: asg-core
  minReplicas: 3
  maxReplicas: 30
  # Политика scale-down: медленная — чтобы не «дёргать» поды при кратковременных спадах нагрузки
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100            # +100% от текущего числа подов за 15с
          periodSeconds: 15
        - type: Pods
          value: 5
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300     # 5 минут бездействия перед уменьшением
      policies:
        - type: Percent
          value: 25            # -25% от текущего числа подов за 60с
          periodSeconds: 60
      selectPolicy: Min
  metrics:
    # CPU utilization — относительно requests.cpu
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory utilization — относительно requests.memory
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Кастомная метрика — RPS на под (требует prometheus-adapter)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
          selector:
            matchLabels:
              app: asg
              component: core
        target:
          type: AverageValue
          averageValue: "3500"   # 3500 RPS на под (= 3500m)
    # Внешняя метрика — общее RPS из очереди Ingress-контроллера (опционально)
    - type: External
      external:
        metric:
          name: nginx_ingress_nginx_requests_per_second
          selector:
            matchLabels:
              ingress: asg-ingress
        target:
          type: AverageValue
          averageValue: "10000"
